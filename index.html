<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b59ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расходы">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=JSON.parse(localStorage.getItem('exp_theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Расходы</title>
<style>
:root{color-scheme:light;--bg:#eef1f6;--card:#fff;--tx:#14213d;--mu:#6b7690;--ac:#2b59ff;--on:#fff;--bd:#dbe0ec}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1320;--card:#171e30;--tx:#eaeefb;--mu:#8b96b3;--ac:#6f93ff;--on:#0e1320;--bd:#27304a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e1320;--card:#171e30;--tx:#eaeefb;--mu:#8b96b3;--ac:#6f93ff;--on:#0e1320;--bd:#27304a}}
html{overscroll-behavior-y:contain}
*{box-sizing:border-box}
.hb{display:flex;gap:8px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.hint{color:var(--mu);font-size:14px;text-align:center;margin:0 0 14px}
form{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;display:grid;gap:12px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--bd);padding-bottom:6px}
.amt:focus-within{border-color:var(--ac)}
.amt input{border:0;background:none;font-size:44px;font-weight:700;width:100%;outline:0;letter-spacing:-.03em;min-width:0}
.amt span{font-size:28px;color:var(--mu)}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
select,input.t{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;color:var(--tx);width:100%;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:15px;font-weight:700;font-size:17px;cursor:pointer}
.st{font-size:13px;color:var(--mu);text-align:center;min-height:18px;margin-top:10px}
h2{font-size:17px;margin:24px 0 8px}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rec small{color:var(--mu);display:block}
.rec b{white-space:nowrap}
details{margin-top:24px;color:var(--mu);font-size:14px}
details input{margin:8px 0}
.sec{position:fixed;inset:0;background:var(--bg);transform:translateY(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain;z-index:5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sec.open{transform:none}
.sec .in{max-width:520px;margin:0 auto;padding:10px 16px 60px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--bd);margin:6px auto 12px}
.chips{display:flex;gap:8px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.tot{font-size:40px;font-weight:700;letter-spacing:-.03em}
.crumb{display:flex;flex-wrap:wrap;gap:6px;color:var(--mu);margin:10px 0;font-size:15px}
.crumb a{color:var(--ac);cursor:pointer;text-decoration:underline}
.donut{width:200px;height:200px;border-radius:50%;margin:16px auto;position:relative}
.donut::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--bg)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.go2{cursor:pointer}
.rh{display:flex;justify-content:space-between;gap:8px}
.rh span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.bar{height:6px;border-radius:3px;background:var(--bd);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mu{color:var(--mu);font-size:14px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
#views{margin:4px 0}
.tree{position:relative;aspect-ratio:10/9;margin:12px 0 16px;border-radius:14px;overflow:hidden}
.tile{position:absolute;border:2px solid var(--bg);border-radius:8px;padding:6px 8px;color:#fff;overflow:hidden;font-size:13px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile.go2{cursor:pointer}.tile b{display:block;font-size:14px}
#cl .ct{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0;color:var(--tx)}
#cl .h{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:14px;padding:6px 8px}
.sc{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:0 2px 0 10px;margin:6px 6px 0 0;font-size:14px}
#sec .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}
.nav .c{text-align:center;font-weight:600;flex:1}.nav small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.ic:disabled{opacity:.3;cursor:default}
.tile.grp b{font-size:15px}
.tile.kid{background:rgba(255,255,255,.2);border-width:1.5px;border-radius:5px;padding:3px 5px;font-size:11.5px}
.tile{white-space:nowrap;text-overflow:ellipsis}
.tile b{display:inline;margin-right:6px}
.tile.grp{padding:5px 8px}
@media(prefers-reduced-motion:reduce){.sec{transition:none}}
</style></head>
<body>
<main>
<header><h1>Расходы</h1><div class="hb"><button class="ic" id="theme" aria-label="Тема"></button><button class="ic" id="open" aria-label="Графики">📊</button></div></header>
<p class="hint">Потяните вниз, чтобы открыть графики</p>
<form id="f" autocomplete="off">
 <div class="amt"><input id="a" inputmode="decimal" placeholder="0" aria-label="Сумма"><span>₽</span></div>
 <div class="two">
  <label>Категория<select id="c"></select></label>
  <label>Подкатегория<select id="s"></select></label>
 </div>
 <label>Наименование<input class="t" id="n" placeholder="Например, йогурт"></label>
 <label>Дата<input class="t" type="date" id="d"></label>
 <button class="go" type="submit">Добавить расход</button>
</form>
<div class="st" id="st"></div>
<h2>Последние записи</h2>
<div id="rec"></div>
<details><summary>Категории</summary>
 <div id="cl"></div>
 <button class="go" id="reset" type="button" style="width:100%;margin-top:8px">Вернуть стандартные</button>
</details>
<details><summary>Подключение Google Таблицы</summary>
 <input class="t" id="u" placeholder="Ссылка веб-приложения Apps Script (…/exec)">
 <button class="go" id="su" type="button" style="width:100%">Сохранить ссылку</button>
</details>
</main>

<section class="sec" id="sec"><div class="in">
 <div class="grab"></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><div class="chips" id="chips"></div><button class="ic" id="close" aria-label="Закрыть">✕</button></div>
 <div class="nav" id="nav"></div>
 <div class="tot" id="tot"></div>
 <div class="crumb" id="crumb"></div>
 <div class="chips" id="views"></div>
 <div class="donut" id="donut"></div><div class="tree" id="tree"></div>
 <div id="rows"></div>
</div></section>

<script>
const DEF={"Продукты":["Молочка","Мясо и рыба","Овощи и фрукты","Хлеб","Бакалея","Напитки","Сладости"],"Транспорт":["Общественный","Такси","Бензин","Парковка"],"Дом":["Коммунальные","Ремонт","Бытовая химия","Мебель"],"Кафе":["Кофе","Обед","Доставка","Ужин"],"Здоровье":["Аптека","Врач","Спорт"],"Одежда":["Одежда","Обувь","Аксессуары"],"Развлечения":["Кино","Подписки","Хобби","Поездки"],"Другое":["Разное"]};
const COL=["#2b59ff","#ff6b4a","#17b890","#f5b301","#9b5cff","#ff4f9a","#00a3d9","#7a8aa6","#8bc34a","#c0762e"];
const $=s=>document.querySelector(s),LS=localStorage;
const ld=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch(e){}};
const iso=d=>d.toLocaleDateString('sv');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru-RU')+' ₽';
let cats=ld('exp_cats',null)||JSON.parse(JSON.stringify(DEF)),items=ld('exp_items',[]),url=ld('exp_url','');
let per='week',off=0,path=[],view=ld('exp_view','ring'),theme=ld('exp_theme','auto');

function opts(el,list,val){el.innerHTML=list.map(x=>`<option>${x}</option>`).join('')+'<option value="__new">＋ Своя…</option>';if(val)el.value=val}
function fillC(v){opts($('#c'),Object.keys(cats),v);fillS()}
function fillS(v){opts($('#s'),cats[$('#c').value]||[],v)}
function addNew(el,isCat){
  const name=(prompt(isCat?'Новая категория':'Новая подкатегория')||'').trim();
  if(!name){isCat?fillC():fillS();return}
  if(isCat){cats[name]=cats[name]||['Разное'];sv('exp_cats',cats);fillC(name);renderCats()}
  else{const c=$('#c').value;if(!cats[c]){alert('Сначала выберите категорию');fillS();return}if(!cats[c].includes(name))cats[c].push(name);sv('exp_cats',cats);fillS(name);renderCats()}
}
$('#c').onchange=e=>e.target.value==='__new'?addNew(e.target,true):fillS();
$('#s').onchange=e=>e.target.value==='__new'&&addNew(e.target,false);

function status(t){$('#st').textContent=t}
function push(it){
  if(!url)return;
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(it)})
   .then(()=>{it.synced=true;sv('exp_items',items);status('Сохранено в таблицу')})
   .catch(()=>status('Нет сети — отправлю позже'));
}
function pull(){
  if(!url)return Promise.resolve();
  return fetch(url).then(r=>r.json()).then(rows=>{
    const ids=new Set(rows.map(r=>r.id)),keep=items.filter(i=>!ids.has(i.id)&&!i.synced);
    items=rows.map(r=>({...r,date:nd(r.date),amount:+r.amount||0,synced:true})).concat(keep);sv('exp_items',items);
    keep.forEach(push);recent();stats();
  }).catch(()=>status('Не удалось загрузить из таблицы'));
}

$('#f').onsubmit=e=>{
  e.preventDefault();
  const amount=parseFloat($('#a').value.replace(',','.')),cat=$('#c').value,sub=$('#s').value;
  if(!(amount>0)){status('Введите сумму');$('#a').focus();return}
  if(cat==='__new'||sub==='__new'){status('Выберите категорию и подкатегорию');return}
  const it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:$('#d').value||iso(new Date()),amount,cat,sub,name:$('#n').value.trim()||'Без названия',synced:false};
  items.push(it);sv('exp_items',items);
  $('#a').value='';$('#n').value='';$('#a').focus();
  status(url?'Отправляю…':'Сохранено на устройстве');
  push(it);recent();
};
function recent(){
  const l=items.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,6);
  $('#rec').innerHTML=l.length?l.map(i=>`<div class="rec"><div>${esc(i.name)}<small>${esc(i.cat)} › ${esc(i.sub)} · ${i.date}</small></div><b>${fmt(i.amount)}</b></div>`).join(''):'<div class="empty">Пока пусто. Добавьте первый расход.</div>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fd=d=>d.getDate()+' '+MS[d.getMonth()];
let R=null;
function range(){
  if(per==='all')return null;
  const n=new Date();
  if(per==='month'){
    const d=new Date(n.getFullYear(),n.getMonth()+off,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
    return [iso(d),iso(e),MN[d.getMonth()]+' '+d.getFullYear(),off===0?'Текущий месяц':off===-1?'Прошлый месяц':''];
  }
  const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-(n.getDay()+6)%7+off*7),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
  return [iso(d),iso(e),fd(d)+' – '+fd(e),off===0?'Текущая неделя':off===-1?'Прошлая неделя':''];
}
const inPer=i=>!R||(i.date>=R[0]&&i.date<=R[1]);
function navHTML(){
  const nv=$('#nav');nv.style.display=R?'':'none';
  if(!R)return;
  const mn=items.reduce((m,i)=>i.date<m?i.date:m,'9999');
  nv.innerHTML=`<button class="ic" data-o="-1" aria-label="Раньше"${mn<R[0]?'':' disabled'}>‹</button><div class="c">${R[2]}<small>${R[3]||'&nbsp;'}</small></div><button class="ic" data-o="1" aria-label="Позже"${off<0?'':' disabled'}>›</button>`;
}
function nd(v){
  v=String(v==null?'':v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  const m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const t=v.match(/^\w{3} (\w{3}) (\d{1,2}) (\d{4})/),mo='JanFebMarAprMayJunJulAugSepOctNovDec'.indexOf(t&&t[1]);
  if(t&&mo>=0)return t[3]+'-'+String(mo/3+1).padStart(2,'0')+'-'+t[2].padStart(2,'0');
  const d=new Date(v);return isNaN(d)?v:iso(d);
}
function squarify(list,W,H){
  const sc=W*H/list.reduce((s,o)=>s+o.sum,0),res=[];let x=0,y=0,w=W,h=H,i=0;
  while(i<list.length){
    const side=Math.min(w,h),worst=r=>{const s=r.reduce((a,o)=>a+o.sum,0)*sc,mx=Math.max(...r.map(o=>o.sum))*sc,mn=Math.min(...r.map(o=>o.sum))*sc;return Math.max(side*side*mx/(s*s),s*s/(side*side*mn))};
    let row=[list[i]],j=i+1;
    while(j<list.length&&worst(row.concat(list[j]))<=worst(row)){row.push(list[j]);j++}
    const s=row.reduce((a,o)=>a+o.sum,0)*sc;
    if(w>=h){const rw=s/h;let yy=y;row.forEach(o=>{const rh=o.sum*sc/rw;res.push({o,x,y:yy,w:rw,h:rh});yy+=rh});x+=rw;w-=rw}
    else{const rh=s/w;let xx=x;row.forEach(o=>{const rw=o.sum*sc/rh;res.push({o,x:xx,y,w:rw,h:rh});xx+=rw});y+=rh;h-=rh}
    i=j;
  }
  return res;
}
function treeHTML(arr,l,keyOf,tot){
  arr=arr.filter(o=>o.sum>0);
  if(!arr.length||!(tot>0))return '<div class="empty">За этот период расходов нет</div>';
  const W=Math.max(200,$('#tree').clientWidth||340),H=Math.round(W*.9),HD=28,out=[],deep=path.length<2;
  const tile=(x,y,w,h,cls,style,attr,inner,t)=>`<div class="tile ${cls}" ${attr} title="${esc(t)}" style="left:${x/W*100}%;top:${y/H*100}%;width:${w/W*100}%;height:${h/H*100}%;${style}">${inner}</div>`;
  const ck=path.length===0?(i=>i.sub):(i=>i.name.trim().toLowerCase()),cl=path.length===0?(i=>i.sub):(i=>i.name.trim());
  squarify(arr,W,H).forEach((g,gi)=>{
    const o=g.o,col=COL[gi%COL.length],hdr=deep&&g.w>=70&&g.h>=HD+24;
    const lab=hdr||(g.w>=60&&g.h>=26)?`<b>${esc(o.label)}</b><span>${Math.round(o.sum/tot*100)}%</span>`:'';
    out.push(tile(g.x,g.y,g.w,g.h,'grp'+(deep?' go2':''),'background:'+col,'data-g="'+esc(o.label)+'"',lab,o.label+' — '+fmt(o.sum)));
    if(!hdr)return;
    const m=new Map();
    l.filter(i=>keyOf(i)===o.key).forEach(i=>{const k=ck(i),c=m.get(k)||{label:cl(i),sum:0};c.sum+=i.amount;m.set(k,c)});
    const kids=[...m.values()].filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
    if(!kids.length)return;
    squarify(kids,g.w-6,g.h-HD-3).forEach(k=>{
      out.push(tile(g.x+3+k.x,g.y+HD+k.y,k.w,k.h,'kid'+(path.length===0?' go2':''),'border-color:'+col,'data-g="'+esc(o.label)+'" data-k="'+esc(k.o.label)+'"',k.w>=56&&k.h>=22?esc(k.o.label):'',k.o.label+' — '+fmt(k.o.sum)));
    });
  });
  return out.join('');
}
function stats(){
  R=range();navHTML();
  $('#chips').innerHTML=[['week','Неделя'],['month','Месяц'],['all','Всё время']].map(([k,t])=>`<button class="chip${per===k?' on':''}" data-p="${k}">${t}</button>`).join('');
  let l=items.filter(inPer);
  if(path[0])l=l.filter(i=>i.cat===path[0]);
  if(path[1])l=l.filter(i=>i.sub===path[1]);
  const keyOf=i=>path.length===0?i.cat:path.length===1?i.sub:i.name.trim().toLowerCase();
  const g=new Map();
  l.forEach(i=>{const k=keyOf(i),o=g.get(k)||{key:k,label:path.length===2?i.name.trim():k,sum:0,n:0};o.sum+=i.amount;o.n++;g.set(k,o)});
  const arr=[...g.values()].sort((a,b)=>b.sum-a.sum),tot=arr.reduce((s,o)=>s+o.sum,0);
  $('#tot').textContent=fmt(tot);
  const names=['Все категории',...path];
  $('#crumb').innerHTML=names.map((n,i)=>i<names.length-1?`<a data-b="${i}">${esc(n)}</a><span>›</span>`:`<b>${esc(n)}</b>`).join('');
  let acc=0;
  const seg=arr.map((o,i)=>{const a=acc/tot*100;acc+=o.sum;return `${COL[i%COL.length]} ${a}% ${acc/tot*100}%`});
  $('#donut').style.background=arr.length?`conic-gradient(${seg.join(',')})`:'var(--bd)';
  $('#views').innerHTML=[['ring','Кольцо'],['tree','Дерево']].map(([k,t])=>`<button class="chip${view===k?' on':''}" data-v="${k}">${t}</button>`).join('');
  $('#donut').style.display=view==='ring'?'':'none';$('#tree').style.display=view==='tree'?'':'none';
  if(view==='tree')$('#tree').innerHTML=treeHTML(arr,l,keyOf,tot);
  $('#rows').innerHTML=arr.length?arr.map((o,i)=>{const p=o.sum/tot*100,c=COL[i%COL.length];
    return `<div class="row${path.length<2?' go2':''}" data-l="${esc(o.label)}"><div class="rh"><span><i class="dot" style="background:${c}"></i>${esc(o.label)}</span><b>${fmt(o.sum)}</b></div><div class="bar"><i style="width:${p}%;background:${c}"></i></div><div class="mu">${Math.round(p)}% · записей: ${o.n}</div></div>`}).join(''):'<div class="empty">За этот период расходов нет</div>';
}
$('#chips').onclick=e=>{const p=e.target.dataset.p;if(p){per=p;off=0;stats()}};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){off+=+b.dataset.o;stats()}};
$('#crumb').onclick=e=>{const b=e.target.dataset.b;if(b!=null){path=path.slice(0,+b);stats()}};
$('#views').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;sv('exp_view',view);stats()}};
$('#tree').onclick=e=>{
  const t=e.target.closest('.tile');if(!t||path.length>1)return;
  if(t.dataset.k){if(path.length===0)path=[t.dataset.g,t.dataset.k];else return}
  else path.push(t.dataset.g);
  stats();
};
$('#rows').onclick=e=>{const r=e.target.closest('.row.go2');if(r){path.push(r.dataset.l);stats()}};

const sec=$('#sec');
function openS(){per='week';off=0;path=[];stats();sec.classList.add('open');sec.scrollTop=0;pull()}
function closeS(){sec.classList.remove('open')}
$('#open').onclick=openS;$('#close').onclick=closeS;
let y0=null,dy=0,drag=false;
const atTop=()=>(document.scrollingElement||document.documentElement).scrollTop<=0;
addEventListener('touchstart',e=>{y0=!sec.classList.contains('open')&&atTop()&&e.touches.length===1?e.touches[0].clientY:null;dy=0;drag=false},{passive:true});
addEventListener('touchmove',e=>{
  if(y0==null)return;
  dy=e.touches[0].clientY-y0;
  if(dy>10){
    if(!drag){drag=true;per='week';off=0;path=[];stats();sec.scrollTop=0;sec.style.transition='none'}
    if(e.cancelable)e.preventDefault();
    sec.style.transform='translateY('+(-innerHeight*1.02+Math.min(dy,innerHeight)*.9)+'px)';
  }
},{passive:false});
function endPull(){
  if(drag){sec.style.transition='';sec.style.transform='';if(dy>110){sec.classList.add('open');pull()}}
  y0=null;drag=false;
}
addEventListener('touchend',endPull);addEventListener('touchcancel',endPull);
let y1=null;
sec.addEventListener('touchstart',e=>{y1=e.touches[0].clientY},{passive:true});
sec.addEventListener('touchend',e=>{if(y1!=null&&y1-e.changedTouches[0].clientY>110&&sec.scrollTop<=0)closeS();y1=null},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape')closeS()});
addEventListener('resize',()=>{if(sec.classList.contains('open')&&view==='tree')stats()});

function renderCats(){
  $('#cl').innerHTML=Object.keys(cats).map(c=>`<div class="ct"><div class="h"><span>${esc(c)}</span><button class="x" data-c="${esc(c)}">Удалить</button></div>${cats[c].map(x=>`<span class="sc">${esc(x)}<button class="x" data-c="${esc(c)}" data-s="${esc(x)}" aria-label="Удалить подкатегорию">✕</button></span>`).join('')}</div>`).join('')||'<div class="empty">Категорий нет. Добавьте через «＋ Своя…» в форме.</div>';
}
$('#cl').onclick=e=>{
  const b=e.target.closest('.x');if(!b)return;
  const c=b.dataset.c,sub=b.dataset.s;
  if(sub==null){
    if(!confirm('Убрать категорию «'+c+'» из списка вместе с подкатегориями?\nСтарые записи останутся в таблице и на графиках.'))return;
    delete cats[c];
  }else cats[c]=cats[c].filter(x=>x!==sub);
  sv('exp_cats',cats);const cv=$('#c').value;fillC(cats[cv]?cv:undefined);renderCats();
};
$('#reset').onclick=()=>{
  if(!confirm('Вернуть стандартный набор категорий? Свои категории пропадут из списка, старые записи останутся.'))return;
  cats=JSON.parse(JSON.stringify(DEF));sv('exp_cats',cats);fillC();renderCats();
};
$('#su').onclick=()=>{url=$('#u').value.trim();sv('exp_url',url);status(url?'Ссылка сохранена':'Синхронизация выключена');pull();items.filter(i=>!i.synced).forEach(push)};
function applyTheme(){const r=document.documentElement;theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=theme;$('#theme').textContent={auto:'🌓',light:'☀️',dark:'🌙'}[theme];$('#theme').title={auto:'Тема: как в системе',light:'Тема: светлая',dark:'Тема: тёмная'}[theme]}
$('#theme').onclick=()=>{theme={auto:'light',light:'dark',dark:'auto'}[theme];sv('exp_theme',theme);applyTheme()};
applyTheme();
$('#u').value=url;$('#d').value=iso(new Date());
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
items.forEach(i=>{i.date=nd(i.date);i.amount=+i.amount||0});
fillC();renderCats();recent();pull();items.filter(i=>!i.synced).forEach(push);
</script>
</body></html>
